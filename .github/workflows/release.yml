name: release
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
      - run: ./gradlew build
      - run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/libs/*.jar --target "$GITHUB_SHA" --title Latest --latest
        env:
          GH_TOKEN: ${{ github.token }}
